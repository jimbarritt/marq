[package]
name = "marq-comments"
version = "0.1.0"
edition = "2021"
description = "Git-backed comments and suggestions on markdown files, stored as W3C Web Annotations"
license = "MIT"

[lib]
name = "marq_comments"
path = "src/lib.rs"

[[bin]]
name = "marq-comments"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
time = { version = "0.3.55", features = ["formatting"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
jsonschema = { version = "0.58.3", default-features = false }
tempfile = "3.27.0"
